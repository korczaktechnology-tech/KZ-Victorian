name: WebLords Foundation Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run complete validation
        run: npm run check:all
