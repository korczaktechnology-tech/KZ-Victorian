name: WebLords Production Validation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "production"
  cancel-in-progress: false

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate complete project
        run: npm run check:all
      - name: Validate production
        run: npm run check:production
      - name: Build production
        run: npm run build:production
      - name: Install browser runtime
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          node scripts/production-server.mjs _dist > /tmp/weblords-server.log 2>&1 &
          echo $! > /tmp/weblords-server.pid
          sleep 2
      - name: Browser smoke test
        run: node scripts/browser-smoke.mjs
      - name: Verify build
        run: test -f _dist/index.html && test -d _dist/src && test -d _dist/assets
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_dist

  deploy:
    needs: validate-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
